

name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: [self-hosted]

    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      id: image 
      run: |
          echo "image_name=my-image-name" >> $GITHUB_OUTPUT
          echo "image_tag=$(date +%s)" >> $GITHUB_OUTPUT
          docker build . --file Dockerfile --tag my-image-name:$(date +%s)
  
  login:
    needs: build 
    runs-on: [self-hosted]
    
    steps:
     - name: authenticate on local docker 
       run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" \
        --password-stdin
       
  Run:
    needs: [build , login]
    runs-on: [self-hosted]
    
    steps:
     - name: Build Docker image
       run: | 
         docker run -d -p  8080:8080 --name ee_python ${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}
  
    
    
