

name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: [self-hosted]

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

  Run:
    runs-on: [self-hosted]
    
    steps:
     - name: Build Docker image
       run: docker -d run -p  8080:8080 --name ee_python my-image-name:$(date +%s)
